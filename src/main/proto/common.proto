syntax = "proto3";
package proto;

option java_multiple_files = true;
option java_package = "com.tub.common";

enum TaskStatus {
  OPEN = 0;
  IN_PROGRESS = 1;
  DONE = 2;
}

message Task {
  int64 taskID = 1;
  string title = 2;
  string description = 3;
  string memberID = 4;
  TaskStatus status = 5;
}

message TaskList {
  repeated Task tasks = 1;
}